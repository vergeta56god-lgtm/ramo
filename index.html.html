<style>

<canvas id="c"></canvas>
<script>
(function () {
'use strict';
var DUR = 26, H = 480, K = H / 640;

/* ---------- utilidades ---------- */
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function sm(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

/* ---------- paleta romantica (RGB) ---------- */
var RED = [215, 45, 45], CRIM = [165, 30, 35], HOT = [235, 70, 140], PINK = [250, 120, 170],
    BLUSH = [252, 175, 195], IVORY = [250, 236, 226], PEACH = [252, 190, 165], LILAC = [225, 165, 215],

var PAL = [RED, RED, CRIM, PINK, PINK, HOT, BLUSH, BLUSH, IVORY, PEACH, RED, PINK, CRIM, LILAC];
var DAISY = [IVORY, BLUSH, IVORY];
var RAMP = ' .,:;+1i7l3Zo25SXE096&8%#B@';

/* ---------- datos del ramo ---------- */
var N = 20, FL = [], GYP = [], PET = [], SPK = [], HEARTS = [], BOKEH = [], i;
for (i = 0; i < N; i++) {
  var th = i * 2.39996, r = Math.sqrt((i + 0.6) / N);
  var f = { x: r * Math.cos(th), z: r * Math.sin(th), y: Math.sqrt(Math.max(0, 1 - r * r)) * 0.92 + 0.04,
            col: PAL[(i * 5) % PAL.length], size: U(0.92, 1.08), ph: U(0, 6.28), delay: 0.35 * r,
            typ: i % 5 === 3 ? 'daisy' : 'rose' };

}
for (i = 0; i < 46; i++) {
  var a = U(0, 6.28), rr = U(0.95, 1.25);
  GYP.push({ x: Math.cos(a) * rr, z: Math.sin(a) * rr, y: Math.sqrt(Math.max(0, 1.2 - rr * rr)) * 0.85, s: U(0.7, 1.4), k: i });
}
for (i = 0; i < 34; i++) PET.push({ x: U(0, 1), v: U(0.04, 0.09), o: U(0, 1.3), ph: U(0, 6.28), c: [RED, PINK, BLUSH, CRIM][Math.floor(U(0, 4))] });
for (i = 0; i < 26; i++) SPK.push({ x: U(0, 1), y: U(0, 1), ph: U(0, 6.28) });

var BOKC = [[240, 80, 120], [245, 170, 110], [250, 110, 150]];
for (i = 0; i < 14; i++) BOKEH.push({ x: U(0, 1), y: U(0, 1), r: U(16, 44), v: U(0.006, 0.016), c: BOKC[i % 3] });

/* ---------- primitivas ---------- */
function circ(g, x, y, r, col) { g.fillStyle = css(col); g.beginPath(); g.arc(x, y, Math.max(r, 0.5), 0, 6.2832); g.fill(); }
function ell(g, x, y, rx, ry, ang, fill, stroke, lw) {

function arc(g, x, y, rx, ry, rot, a0, a1, col, lw) {

  g.strokeStyle = css(col); g.lineWidth = lw || 1; g.stroke();

function shade(g, px, py, r) {

  g.fillStyle = gr; g.beginPath(); g.arc(px, py, r, 0, 6.2832); g.fill();
}

function rose(g, px, py, rad, col, ph, b, light) {

  circ(g, px + rad * 0.28, py + rad * 0.12, Math.max(1, rad * 0.05), tint([235, 245, 255], light));

function daisy(g, px, py, rad, col, ph, b, light) {

    var bend = 0.1 * L * Math.sin(Math.PI * ss);

    for (j = 0; j < n; j++) { if (j) g.lineTo(cx[j] + nx * pr[j] * fa, cy[j] + ny * pr[j] * fa); else g.moveTo(cx[j] + nx * pr[j] * fa, cy[j] + ny * pr[j] * fa); }

  poly(0.92, 0.04, tint([38, 94, 34], light));
  g.strokeStyle = css(tint([38, 100, 34], light)); g.lineWidth = 1; g.beginPath();
  for (j = 2; j < 14; j += 2) for (var sg = 1; sg >= -1; sg -= 2) {

function stem(g, x0, y0, x1, y1, th, light) {
  var mx = (x0 + x1) / 2 + (y1 - y0) * 0.1, my = (y0 + y1) / 2;
  g.lineCap = 'round';
  g.strokeStyle = css(tint([22, 68, 20], light)); g.lineWidth = Math.max(1, th);
  g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(mx, my, x1, y1); g.stroke();

function hgrad(g, x0, x1, stops) {

  for (var j = 0; j < stops.length; j++) gr.addColorStop(stops[j][0], css(stops[j][1]));
  return gr;
}

  ell(g, cx, baseY - vh, 0.37 * S, 0.05 * S, 0, null, tint(ROSEGOLD, 1.1, 15), Math.max(1, 0.02 * S));
  var by = baseY - vh * 0.835, bx = cx - 0.1 * S, red = [200, 35, 40], dred = [135, 20, 25], hl = [250, 100, 110];
  [-1, 1].forEach(function (sg) {

    ell(g, bx + sg * 0.11 * S, by - 0.03 * S, 0.11 * S, 0.06 * S, rot, red);
    ell(g, bx + sg * 0.11 * S, by - 0.045 * S, 0.08 * S, 0.02 * S, rot, hl);
    ell(g, bx + sg * 0.11 * S, by - 0.03 * S, 0.11 * S, 0.06 * S, rot, null, dred, 1);
    g.fillStyle = css(dred); g.beginPath();

/* ---------- diseno de pantalla ---------- */
var cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
var vw, vh, dpr, cols, rows, cw, ch, W;
var scene, sg, bgc, gs1, gs2, mid, midc, small, smc, bgcell, bgcc, bgimg, start = performance.now();
var colScale = 1, spent = 0, frames = 0;

function makeBG() {
  bgc = cv(W, H); var g = bgc.getContext('2d');
  g.fillStyle = 'rgb(22,5,18)'; g.fillRect(0, 0, W, H);
  g.save(); g.translate(W / 2, H * 0.5); g.scale(W * 0.55, H * 0.6);
  var gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  for (var j = 0; j <= 10; j++) { var t = j / 10, e = Math.pow(1 - t, 1.6); gr.addColorStop(t, 'rgb(' + (22 + 14 * e | 0) + ',' + (5 + 4 * e | 0) + ',' + (18 + 12 * e | 0) + ')'); }
  g.fillStyle = gr; g.fillRect(-3, -3, 6, 6); g.restore();
}

function setup() {
  vw = window.innerWidth; vh = window.innerHeight; dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.round(vw * dpr); cvs.height = Math.round(vh * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cols = clamp(Math.round(vw / 5.5 * colScale), 44, 130); cw = vw / cols; ch = cw * 2; rows = Math.max(10, Math.floor(vh / ch));
  W = Math.max(200, Math.round(H * cols / (rows * 2)));
  scene = cv(W, H); sg = scene.getContext('2d');
  gs1 = cv(W / 4, H / 4); gs2 = cv(W / 8, H / 8);
  midc = cv(cols * 2, rows * 2); mid = midc.getContext('2d');
  smc = cv(cols, rows); small = smc.getContext('2d', { willReadFrequently: true });
  bgcell = cv(cols, rows); bgcc = bgcell.getContext('2d'); bgimg = bgcc.createImageData(cols, rows);
  makeBG();
}

function drawScene(t) {

  g.drawImage(bgc, 0, 0);

  var zoom = 0.45 + (zend - 0.45) * sm(0.05, 0.78, u), bloom = sm(0.04, 0.78, u);
  var rot = 0.35 * Math.sin(u * 4) + u * 0.9, sway = 0.012 * W * Math.sin(t * 1.1) * (1 - sm(0, 0.6, u));

  if (top > 0) { g.strokeStyle = 'rgb(120,150,190)'; g.lineWidth = 1; g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(cx, top); g.stroke(); }
  SPK.forEach(function (s) {
    if (Math.sin(t * 2.5 + s.ph) > 0.9 && u > 0.25) {
      var x = s.x * W, y = s.y * H; g.strokeStyle = 'rgb(240,205,200)'; g.lineWidth = 1; g.beginPath();
      g.moveTo(x - 3, y); g.lineTo(x + 3, y); g.moveTo(x, y - 3); g.lineTo(x, y + 3); g.stroke();

  function leaves(front) {

      if ((zr >= 0.15) !== front) continue;

  var items = [], j, o;
